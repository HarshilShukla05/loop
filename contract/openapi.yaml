openapi: 3.1.0
info:
  title: Loop API
  version: 0.1.0
  description: >
    Instagram comment-to-DM automation. This is the source-of-truth contract
    between the Go backend (server/) and the React SPA (dashboard/).
    Scope: Flow A — authentication, session, connected-account status.
servers:
  - url: http://localhost:8080
    description: Local dev

paths:
  /healthz:
    get:
      operationId: health
      summary: Liveness probe
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required: [status]

  /config:
    get:
      operationId: publicConfig
      summary: Public client configuration (no auth required)
      responses:
        "200":
          description: Public configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  privacyUrl:
                    type: string
                  termsUrl:
                    type: string
                  dataDeletionUrl:
                    type: string
                required: [privacyUrl, termsUrl, dataDeletionUrl]

  /me:
    get:
      operationId: session
      summary: Current session and connected account
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteAccount
      summary: Delete the account and all stored data (Meta data-deletion path)
      description: |
        Permanently deletes the user's Loop account and everything associated
        with it: the Instagram connection (access tokens, account identifiers),
        cached media metadata, comment events, DM history, and automation
        rules. Clears the session. This backs the self-service option promised
        on the public data-deletion page.
      responses:
        "204":
          description: Account and all data deleted; session cleared
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/instagram:
    get:
      operationId: startInstagramAuth
      summary: Begin Instagram login (login = connect = subscribe in one OAuth)
      responses:
        "302":
          description: Redirect to Instagram authorization

  /auth/instagram/callback:
    get:
      operationId: instagramCallback
      summary: OAuth callback; sets session cookie, redirects to the dashboard
      description: |
        On success redirects to {dashboardURL}/dashboard. On any failure it
        must redirect to {dashboardURL}/?error=<code> (never the API origin,
        never a raw error page) so the login screen can explain. Error codes:
        access_denied (user declined), not_professional (account is not a
        Business/Creator account), exchange_failed, connect_failed.
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      responses:
        "302":
          description: Redirect to dashboard (or to /?error=<code> on failure)

  /auth/logout:
    post:
      operationId: logout
      summary: Clear the session
      responses:
        "204":
          description: Logged out

  /media:
    get:
      operationId: media
      summary: List the connected account's posts (for the rule picker)
      responses:
        "200":
          description: Media list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Media"
                required: [items]
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /rules:
    get:
      operationId: listRules
      summary: List automations
      responses:
        "200":
          description: Rules list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Rule"
                required: [items]
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createRule
      summary: Create an automation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /rules/{id}:
    delete:
      operationId: deleteRule
      summary: Delete an automation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "401":
          description: Not authenticated
        "404":
          description: Not found

  /stats:
    get:
      operationId: getStats
      summary: Reach stats — aggregate automation funnel per window and per post
      description: |
        Aggregate counters for the connected account, for a time window:
        comments seen on automated posts -> comments that matched a keyword
        (eligible) -> DMs delivered. previousTotals covers the equally long
        window immediately before (null for window=all) so the UI can show
        deltas. perPost groups by media: mediaId=null bucket collects
        all-posts rules. Designed to gain a "followed" stage when
        follow-gating ships.
      parameters:
        - name: window
          in: query
          schema:
            type: string
            enum: [today, 7d, 30d, all]
            default: 7d
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    Session:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        connection:
          oneOf:
            - $ref: "#/components/schemas/Connection"
            - type: "null"
      required: [user, connection]

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
      required: [id]

    Connection:
      type: object
      properties:
        platform:
          type: string
          example: instagram
        username:
          type: string
          example: creator.handle
        status:
          type: string
          enum: [connected, token_expired, disconnected, error]
        subscriptionStatus:
          type: string
          enum: [pending, active, failed]
      required: [platform, username, status, subscriptionStatus]

    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]

    Media:
      type: object
      properties:
        id:
          type: string
        caption:
          type: string
        mediaType:
          type: string
        mediaUrl:
          type: string
        thumbnailUrl:
          type: string
        permalink:
          type: string
        timestamp:
          type: string
      required: [id, mediaType]

    Rule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        mediaId:
          oneOf:
            - type: string
            - type: "null"
        keywords:
          type: array
          items:
            type: string
        matchMode:
          type: string
        responseMessage:
          type: string
        responseLink:
          oneOf:
            - type: string
            - type: "null"
        requireFollow:
          type: boolean
        captureEmail:
          type: boolean
        status:
          type: string
      required:
        [id, mediaId, keywords, matchMode, responseMessage, responseLink, requireFollow, captureEmail, status]

    RuleInput:
      type: object
      properties:
        mediaId:
          oneOf:
            - type: string
            - type: "null"
          description: null = all posts (including future)
        keywords:
          type: array
          items:
            type: string
          description: empty = reply on any comment
        responseMessage:
          type: string
        responseLink:
          oneOf:
            - type: string
            - type: "null"
        requireFollow:
          type: boolean
          default: false
        captureEmail:
          type: boolean
          default: false
      required: [mediaId, keywords, responseMessage]

    StatsTotals:
      type: object
      properties:
        comments:
          type: integer
          description: comments seen on posts with an active automation
        matched:
          type: integer
          description: comments that matched a keyword (eligible for a DM)
        sent:
          type: integer
          description: DMs successfully delivered
        failed:
          type: integer
      required: [comments, matched, sent, failed]

    PostStats:
      type: object
      properties:
        mediaId:
          oneOf:
            - type: string
            - type: "null"
          description: null = the all-posts automation bucket
        keywords:
          type: array
          items:
            type: string
          description: keywords of the rules feeding this row (empty = any comment)
        comments:
          type: integer
        matched:
          type: integer
        sent:
          type: integer
        lastEventAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
      required: [mediaId, keywords, comments, matched, sent, lastEventAt]

    Stats:
      type: object
      properties:
        window:
          type: string
          enum: [today, 7d, 30d, all]
        totals:
          $ref: "#/components/schemas/StatsTotals"
        previousTotals:
          oneOf:
            - $ref: "#/components/schemas/StatsTotals"
            - type: "null"
          description: same-length window immediately before; null for window=all
        perPost:
          type: array
          items:
            $ref: "#/components/schemas/PostStats"
      required: [window, totals, previousTotals, perPost]
