server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;

    # SPA history fallback, scoped under the /loop path prefix this service
    # is routed on (Inframan forwards the full path, including the prefix).
    location /loop/ {
        try_files $uri $uri/ /loop/index.html;
    }

    location = /loop {
        return 301 /loop/;
    }
}
