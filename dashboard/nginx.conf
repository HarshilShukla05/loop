server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;

    # SPA history fallback, scoped under the /loop-app path prefix this service
    # is routed on (Inframan forwards the full path, including the prefix).
    # NOTE: the prefix must NOT be a string-prefix of the other services'
    # prefixes (/loop-api, /loop-landing) — Istio prefix matching is plain
    # string matching, and an overlapping prefix swallows their traffic.
    location /loop-app/ {
        try_files $uri $uri/ /loop-app/index.html;
    }

    location = /loop-app {
        return 301 /loop-app/;
    }
}
